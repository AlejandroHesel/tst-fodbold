<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TST Fodbold - Rangliste</title>
    <style>
        :root {
            --primary-color: #1a5c1a;
            --secondary-color: #2d8c2d;
            --accent-color: #4CAF50;
            --background-color: #0f3d0f;
            --card-color: #1e1e1e;
            --text-color: #ffffff;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --pitch-line: rgba(255,255,255,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
        }

        header h1 { font-size: 2.5em; letter-spacing: 2px; text-transform: uppercase; }
        header p { color: var(--accent-color); margin-top: 5px; font-size: 0.9em; }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background-color: var(--primary-color);
        }

        .tab-button {
            padding: 12px 40px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: var(--text-color);
            font-size: 1em;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-button.active { background-color: var(--accent-color); color: #000; font-weight: bold; }
        .tab-button:hover { background-color: var(--secondary-color); }

        .points-guide { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .points-guide h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .points-grid { display: flex; flex-wrap: wrap; gap: 8px; }

        .point-badge {
            background-color: var(--card-color);
            border: 1px solid var(--secondary-color);
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .point-badge span { color: var(--accent-color); font-weight: bold; }

        .leaderboard { max-width: 800px; margin: 20px auto; padding: 0 20px 40px; }
        .leaderboard h2 { text-align: center; margin-bottom: 20px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; }

        .player-card {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 4px solid var(--secondary-color);
            transition: transform 0.2s;
        }

        .player-card:hover { transform: translateX(5px); }
        .player-card.rank-1 { border-left-color: var(--gold); }
        .player-card.rank-2 { border-left-color: var(--silver); }
        .player-card.rank-3 { border-left-color: var(--bronze); }

        .rank { font-size: 1.5em; font-weight: bold; min-width: 40px; text-align: center; }
        .rank-1 .rank { color: var(--gold); }
        .rank-2 .rank { color: var(--silver); }
        .rank-3 .rank { color: var(--bronze); }

        .player-info { flex: 1; }
        .player-name { font-size: 1.1em; font-weight: bold; }
        .player-details { font-size: 0.8em; color: #aaa; margin-top: 3px; }
        .player-points { font-size: 1.8em; font-weight: bold; color: var(--accent-color); }
        .points-label { font-size: 0.7em; color: #aaa; text-align: right; }

        .match-history { max-width: 800px; margin: 20px auto; padding: 0 20px 40px; }
        .match-history h2 { text-align: center; margin-bottom: 20px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; }

        .match-card {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid var(--secondary-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .match-card:hover { transform: translateX(5px); border-left-color: var(--accent-color); }
        .match-card-left { display: flex; flex-direction: column; gap: 4px; }
        .match-teams { font-size: 1.1em; font-weight: bold; }
        .match-date { font-size: 0.8em; color: #aaa; }

        .match-score {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            min-width: 80px;
        }

        .match-result {
            font-size: 0.75em;
            text-align: center;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        .result-win { background-color: #1a5c1a; color: #4CAF50; }
        .result-loss { background-color: #5c1a1a; color: #f44336; }
        .result-draw { background-color: #5c4a1a; color: #FFC107; }
        .match-arrow { color: #aaa; font-size: 1.2em; }

        .match-detail { display: none; }
        .match-detail.active { display: block; }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 20px auto;
            max-width: 800px;
            width: fit-content;
            transition: all 0.2s;
        }

        .back-button:hover { background-color: var(--accent-color); color: #000; }

        .match-detail-header {
            max-width: 800px;
            margin: 0 auto 20px;
            padding: 0 20px;
            text-align: center;
        }

        .match-detail-header h2 { font-size: 1.8em; color: var(--accent-color); }
        .match-detail-header .big-score { font-size: 3em; font-weight: bold; margin: 10px 0; }
        .match-detail-header .match-detail-date { color: #aaa; font-size: 0.9em; }

        .pitch-container { max-width: 500px; margin: 0 auto 30px; padding: 0 20px; }

        .pitch {
            background: linear-gradient(180deg,
                #2d7a2d 0%, #327a32 8.33%, #2d7a2d 8.33%, #327a32 16.66%,
                #2d7a2d 16.66%, #327a32 25%, #2d7a2d 25%, #327a32 33.33%,
                #2d7a2d 33.33%, #327a32 41.66%, #2d7a2d 41.66%, #327a32 50%,
                #2d7a2d 50%, #327a32 58.33%, #2d7a2d 58.33%, #327a32 66.66%,
                #2d7a2d 66.66%, #327a32 75%, #2d7a2d 75%, #327a32 83.33%,
                #2d7a2d 83.33%, #327a32 91.66%, #2d7a2d 91.66%, #327a32 100%
            );
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 20px 10px;
            position: relative;
            overflow: hidden;
        }

        .pitch::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--pitch-line);
            transform: translateY(-50%);
        }

        .pitch::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            border: 2px solid var(--pitch-line);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .pitch-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .pitch-row:last-child { margin-bottom: 0; }

        .pitch-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 60px;
        }

        .player-shirt { width: 40px; height: 40px; position: relative; }
        .player-shirt svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .shirt-points {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--gold);
            color: #000;
            font-size: 0.6em;
            font-weight: bold;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pitch-player-name {
            font-size: 0.65em;
            text-align: center;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            max-width: 65px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0,0,0,0.5);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .substitutes-section { max-width: 500px; margin: 0 auto 30px; padding: 0 20px; }
        .substitutes-section h3 { color: var(--accent-color); font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }

        .substitutes-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px 10px;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .match-points-section { max-width: 800px; margin: 0 auto 40px; padding: 0 20px; }
        .match-points-section h3 { color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.9em; }

        .match-player-points {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 3px solid var(--secondary-color);
        }

        .match-player-points-name { font-weight: bold; }
        .match-player-points-score { font-size: 1.4em; font-weight: bold; color: var(--accent-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .last-updated { text-align: center; color: #666; font-size: 0.8em; padding-bottom: 20px; }

        .match-subnav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .subnav-button {
            padding: 8px 25px;
            border: 1px solid var(--secondary-color);
            background: transparent;
            color: var(--text-color);
            font-size: 0.9em;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .subnav-button.active { background-color: var(--secondary-color); font-weight: bold; }
        .subnav-button:hover { background-color: var(--secondary-color); }

        .match-subview { display: none; }
        .match-subview.active { display: block; }

        /* Loading spinner */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-color);
            font-size: 1.1em;
        }

        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--secondary-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            text-align: center;
            padding: 20px;
            color: #f44336;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚽ TST Fodbold</h1>
        <p>Sæson 2025/2026 · Rangliste</p>
    </header>

    <div class="tabs">
        <button class="tab-button active" onclick="showTab('training', this)">🏃 Træning</button>
        <button class="tab-button" onclick="showTab('match', this)">⚽ Kamp</button>
    </div>

    <!-- TRÆNINGS-TAB -->
    <div id="training" class="tab-content active">
        <div class="points-guide">
            <h3>⭐ Sådan optjenes point</h3>
            <div class="points-grid" id="training-guide"></div>
        </div>
        <div class="leaderboard">
            <h2>🏃 Træningsrangliste</h2>
            <div id="training-list"><div class="loading">Henter data</div></div>
        </div>
    </div>

    <!-- KAMP-TAB -->
    <div id="match" class="tab-content">
        <div class="match-subnav">
            <button class="subnav-button active" onclick="showMatchSubview('match-leaderboard', this)">🏆 Rangliste</button>
            <button class="subnav-button" onclick="showMatchSubview('match-history-view', this)">📋 Kampe</button>
        </div>

        <div id="match-leaderboard" class="match-subview active">
            <div class="points-guide">
                <h3>⭐ Sådan optjenes point</h3>
                <div class="points-grid" id="match-guide"></div>
            </div>
            <div class="leaderboard">
                <h2>⚽ Kamprangliste</h2>
                <div id="match-list"><div class="loading">Henter data</div></div>
            </div>
        </div>

        <div id="match-history-view" class="match-subview">
            <div class="match-history">
                <h2>📋 Kamphistorik</h2>
                <div id="match-history-list"><div class="loading">Henter data</div></div>
            </div>
        </div>

        <div id="match-detail-view" class="match-detail">
            <button class="back-button" onclick="closeMatchDetail()">← Tilbage til kampe</button>
            <div class="match-detail-header">
                <h2 id="detail-teams"></h2>
                <div class="big-score" id="detail-score"></div>
                <div class="match-detail-date" id="detail-date"></div>
            </div>
            <div class="pitch-container">
                <div class="pitch" id="detail-pitch"></div>
            </div>
            <div class="substitutes-section">
                <h3>🔄 Indskiftere</h3>
                <div class="substitutes-row" id="detail-subs"></div>
            </div>
            <div class="match-points-section">
                <h3>🏆 Point denne kamp</h3>
                <div id="detail-points"></div>
            </div>
        </div>
    </div>

    <p class="last-updated" id="last-updated"></p>

    <script>
        // ============================================================
        // SHEET ID - skift dette hvis du flytter dit Google Sheet
        // ============================================================
        const SHEET_ID = '1Mi_8L6jj4FkoDsWNcrwRVZTnCldJrZJ22m8qd3tMYGo';

        // ============================================================
        // POINT-REGLER (disse styres stadig i koden)
        // Tilføj, fjern eller ændr regler her
        // ============================================================
        const trainingPointRules = [
            { label: "Møder til træning", points: 3 },
            { label: "Møder til tiden", points: 1 },
            { label: "Rengøring", points: 2 },
            { label: "Sætter op/pakker ned", points: 1 },
            { label: "5 træninger i træk", points: 5 },
        ];

        const matchPointRules = [
            { label: "Møder til kamp", points: 3 },
            { label: "Mål", points: 3 },
            { label: "Assist", points: 2 },
            { label: "Rent baghold", points: 3 },
            { label: "Mand for kampen", points: 5 },
        ];

        // ============================================================
        // HERUNDER SKAL DU IKKE ÆNDRE NOGET
        // ============================================================

        // Globale data-objekter
        let players = {};       // { player_id: { name, position } }
        let trainingData = [];  // [{ name, points }]
        let matchData = [];     // [{ name, points }]
        let matchHistory = [];  // [{ id, away, home_score, away_score, date, weekday }]
        let matchLineups = [];  // [{ match_id, position, player_id }]
        let matchPoints = [];   // [{ match_id, player_id, points }]

        // Hent CSV fra Google Sheets
        function fetchSheet(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;
            return fetch(url)
                .then(res => res.text())
                .then(csv => parseCSV(csv));
        }

        // Parse CSV til array af objekter
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
            return lines.slice(1).map(line => {
                // Håndter kommaer inde i citationstegn
                const values = [];
                let current = '';
                let inQuotes = false;
                for (let char of line) {
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
                    else { current += char; }
                }
                values.push(current.trim());

                const obj = {};
                headers.forEach((h, i) => { obj[h] = values[i] || ''; });
                return obj;
            }).filter(row => Object.values(row).some(v => v !== ''));
        }

        // Indlæs alle sheets
        async function loadAllData() {
            try {
                // Hent players
                const playersRaw = await fetchSheet('players');
                playersRaw.forEach(p => {
                    players[p.player_id] = { name: p.name, position: p.position };
                });

                // Hent training
                const trainingRaw = await fetchSheet('training');
                trainingData = trainingRaw.map(row => ({
                    name: players[row.player_id]?.name || row.player_id,
                    points: parseFloat(row.total) || 0,
                })).sort((a, b) => b.points - a.points);

                // Hent matches
                const matchesRaw = await fetchSheet('matches');
                matchHistory = matchesRaw.map(row => ({
                    id: row.id,
                    away: row.away,
                    homeScore: parseInt(row.home_score) || 0,
                    awayScore: parseInt(row.away_score) || 0,
                    date: row.date,
                    weekday: row.weekday,
                }));

                // Hent match_lineups
                const lineupsRaw = await fetchSheet('match_lineups');
                matchLineups = lineupsRaw.map(row => ({
                    match_id: row.match_id,
                    position: row.position,
                    player_id: row.player_id,
                    name: players[row.player_id]?.name || row.player_id,
                }));

                // Hent match_points
                const pointsRaw = await fetchSheet('match_points');

                // Byg match_points liste (en række per spiller per kamp)
                // Kolonner: player_id, total, kamp1, kamp2, ...
                // Vi skal mappe kolonne-headers til match id'er
                if (pointsRaw.length > 0) {
                    const headers = Object.keys(pointsRaw[0]);
                    // Headers efter 'total' er kamp-kolonner (match id'er eller navne)
                    const matchCols = headers.slice(2); // springer player_id og total over

                    pointsRaw.forEach(row => {
                        const playerId = row.player_id;
                        matchCols.forEach((col, i) => {
                            const pts = parseFloat(row[col]) || 0;
                            if (pts > 0) {
                                matchPoints.push({
                                    match_id: matchHistory[i]?.id || (i + 1).toString(),
                                    player_id: playerId,
                                    name: players[playerId]?.name || playerId,
                                    points: pts,
                                });
                            }
                        });
                    });

                    // Byg samlet kamprangliste
                    const matchTotals = {};
                    pointsRaw.forEach(row => {
                        const name = players[row.player_id]?.name || row.player_id;
                        matchTotals[name] = parseFloat(row.total) || 0;
                    });

                    matchData = Object.entries(matchTotals)
                        .map(([name, points]) => ({ name, points }))
                        .sort((a, b) => b.points - a.points);
                }

                // Byg siden
                buildGuide(trainingPointRules, 'training-guide');
                buildGuide(matchPointRules, 'match-guide');
                buildLeaderboard(trainingData, 'training-list');
                buildLeaderboard(matchData, 'match-list');
                buildMatchHistory();

                const now = new Date();
                document.getElementById('last-updated').textContent =
                    `Sidst opdateret: ${now.getDate()}. ${['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'][now.getMonth()]} ${now.getFullYear()}`;

            } catch (err) {
                console.error(err);
                document.querySelectorAll('.loading').forEach(el => {
                    el.className = 'error';
                    el.textContent = 'Kunne ikke hente data. Tjek at Google Sheet er publiceret korrekt.';
                });
            }
        }

        function buildGuide(rules, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            rules.forEach(rule => {
                const badge = document.createElement('div');
                badge.className = 'point-badge';
                badge.innerHTML = `${rule.label} <span>+${rule.points}p</span>`;
                container.appendChild(badge);
            });
        }

        function buildLeaderboard(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!data.length) {
                container.innerHTML = '<div class="error">Ingen data endnu</div>';
                return;
            }

            data.forEach((player, index) => {
                const rank = index + 1;
                const rankClass = rank <= 3 ? `rank-${rank}` : '';
                const rankDisplay = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                const card = document.createElement('div');
                card.className = `player-card ${rankClass}`;
                card.innerHTML = `
                    <div class="rank">${rankDisplay}</div>
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                    </div>
                    <div>
                        <div class="player-points">${player.points}</div>
                        <div class="points-label">point</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function buildMatchHistory() {
            const container = document.getElementById('match-history-list');
            container.innerHTML = '';

            if (!matchHistory.length) {
                container.innerHTML = '<div class="error">Ingen kampe endnu</div>';
                return;
            }

            matchHistory.forEach(match => {
                const diff = match.homeScore - match.awayScore;
                const resultClass = diff > 0 ? 'result-win' : diff < 0 ? 'result-loss' : 'result-draw';
                const resultText = diff > 0 ? 'SEJR' : diff < 0 ? 'NEDERLAG' : 'UAFGJORT';

                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => openMatchDetail(match.id);
                card.innerHTML = `
                    <div class="match-card-left">
                        <div class="match-teams">TST Fodbold vs ${match.away}</div>
                        <div class="match-date">📅 ${match.weekday} ${match.date}</div>
                    </div>
                    <div class="match-score">${match.homeScore}-${match.awayScore}</div>
                    <div>
                        <div class="match-result ${resultClass}">${resultText}</div>
                    </div>
                    <div class="match-arrow">›</div>
                `;
                container.appendChild(card);
            });
        }

        function shirtSVG() {
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="30,10 70,10 85,30 70,25 70,90 30,90 30,25 15,30" fill="#1a5c1a" stroke="#4CAF50" stroke-width="3"/>
                <polygon points="30,10 50,20 70,10 70,25 50,30 30,25" fill="#2d8c2d"/>
            </svg>`;
        }

        function subShirtSVG() {
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="30,10 70,10 85,30 70,25 70,90 30,90 30,25 15,30" fill="#0f3d0f" stroke="#2d8c2d" stroke-width="3"/>
                <polygon points="30,10 50,20 70,10 70,25 50,30 30,25" fill="#1a5c1a"/>
            </svg>`;
        }

        function buildPitchRow(players, pointsMap, isSub = false) {
            const row = document.createElement('div');
            row.className = 'pitch-row';
            players.forEach(({ name }) => {
                const pts = pointsMap[name] || 0;
                const el = document.createElement('div');
                el.className = 'pitch-player';
                el.innerHTML = `
                    <div class="player-shirt">
                        ${isSub ? subShirtSVG() : shirtSVG()}
                        <div class="shirt-points">${pts}</div>
                    </div>
                    <div class="pitch-player-name">${name.split(' ')[0]}</div>
                `;
                row.appendChild(el);
            });
            return row;
        }

        function openMatchDetail(matchId) {
            const match = matchHistory.find(m => m.id === matchId);
            if (!match) return;

            document.getElementById('match-history-view').style.display = 'none';
            document.querySelector('.match-subnav').style.display = 'none';
            document.getElementById('match-detail-view').classList.add('active');

            document.getElementById('detail-teams').textContent = `TST Fodbold vs ${match.away}`;
            document.getElementById('detail-score').textContent = `${match.homeScore} - ${match.awayScore}`;
            document.getElementById('detail-date').textContent = `📅 ${match.weekday} ${match.date}`;

            // Point-map for denne kamp
            const pointsMap = {};
            matchPoints
                .filter(p => p.match_id === matchId)
                .forEach(p => { pointsMap[p.name] = p.points; });

            // Lineup for denne kamp
            const lineup = matchLineups.filter(l => l.match_id === matchId);

            const getPosition = (pos) => lineup.filter(l => l.position === pos);

            // Byg banen
            const pitch = document.getElementById('detail-pitch');
            pitch.innerHTML = '';

            // 4-2-3-1 formation (angriber øverst = tættest på modstander)
            const rows = [
                getPosition('striker'),
                [...getPosition('left_wing'), ...getPosition('attacking_mid'), ...getPosition('right_wing')],
                getPosition('defensive_mid'),
                [...getPosition('left_back'), ...getPosition('centerback'), ...getPosition('right_back')],
                getPosition('goalkeeper'),
            ];

            rows.forEach(row => {
                if (row.length > 0) pitch.appendChild(buildPitchRow(row, pointsMap));
            });

            // Indskiftere
            const subs = getPosition('substitute');
            const subsContainer = document.getElementById('detail-subs');
            subsContainer.innerHTML = '';
            if (subs.length) {
                const subRow = buildPitchRow(subs, pointsMap, true);
                subRow.className = '';
                Array.from(subRow.children).forEach(child => subsContainer.appendChild(child));
            }

            // Point-liste
            const pointsContainer = document.getElementById('detail-points');
            pointsContainer.innerHTML = '';
            const matchPts = matchPoints
                .filter(p => p.match_id === matchId)
                .sort((a, b) => b.points - a.points);

            matchPts.forEach(player => {
                const el = document.createElement('div');
                el.className = 'match-player-points';
                el.innerHTML = `
                    <div class="match-player-points-name">${player.name}</div>
                    <div class="match-player-points-score">+${player.points}p</div>
                `;
                pointsContainer.appendChild(el);
            });
        }

        function closeMatchDetail() {
            document.getElementById('match-detail-view').classList.remove('active');
            document.getElementById('match-history-view').style.display = 'block';
            document.querySelector('.match-subnav').style.display = 'flex';
        }

        function showTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');
        }

        function showMatchSubview(viewName, btn) {
            document.querySelectorAll('.match-subview').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.subnav-button').forEach(b => b.classList.remove('active'));
            document.getElementById(viewName).classList.add('active');
            btn.classList.add('active');
        }

        // Start
        loadAllData();
    </script>

</body>
</html>
