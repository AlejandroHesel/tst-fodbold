<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TST Fodbold - Rangliste</title>
    <style>
        :root {
            --primary-color: #1a5c1a;
            --secondary-color: #2d8c2d;
            --accent-color: #4CAF50;
            --background-color: #0f3d0f;
            --card-color: #1e1e1e;
            --text-color: #ffffff;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --pitch-line: rgba(255,255,255,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
        }

        header h1 { font-size: 2.5em; letter-spacing: 2px; text-transform: uppercase; }
        header p { color: var(--accent-color); margin-top: 5px; font-size: 0.9em; }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background-color: var(--primary-color);
        }

        .tab-button {
            padding: 12px 40px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: var(--text-color);
            font-size: 1em;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-button.active { background-color: var(--accent-color); color: #000; font-weight: bold; }
        .tab-button:hover { background-color: var(--secondary-color); }

        .points-guide { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .points-guide h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .points-grid { display: flex; flex-wrap: wrap; gap: 8px; }

        .point-badge {
            background-color: var(--card-color);
            border: 1px solid var(--secondary-color);
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .point-badge span { color: var(--accent-color); font-weight: bold; }

        .leaderboard { max-width: 800px; margin: 20px auto; padding: 0 20px 40px; }
        .leaderboard h2 { text-align: center; margin-bottom: 20px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; }

        .player-card {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 4px solid var(--secondary-color);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .player-card:hover { transform: translateX(5px); border-left-color: var(--accent-color); }
        .player-card.rank-1 { border-left-color: var(--gold); }
        .player-card.rank-2 { border-left-color: var(--silver); }
        .player-card.rank-3 { border-left-color: var(--bronze); }

        .rank { font-size: 1.5em; font-weight: bold; min-width: 40px; text-align: center; }
        .rank-1 .rank { color: var(--gold); }
        .rank-2 .rank { color: var(--silver); }
        .rank-3 .rank { color: var(--bronze); }

        .card-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--secondary-color);
            flex-shrink: 0;
        }

        .avatar-placeholder {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.8);
            font-weight: bold;
            font-size: 1em;
            flex-shrink: 0;
            border-radius: 50%;
        }

        .player-info { flex: 1; min-width: 0; }
        .player-name { font-size: 1.1em; font-weight: bold; }
        .player-details { font-size: 0.8em; color: #aaa; margin-top: 3px; }
        .player-points { font-size: 1.8em; font-weight: bold; color: var(--accent-color); }
        .points-label { font-size: 0.7em; color: #aaa; text-align: right; }

        .match-history { max-width: 800px; margin: 20px auto; padding: 0 20px 40px; }
        .match-history h2 { text-align: center; margin-bottom: 20px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; }

        .match-card {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid var(--secondary-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .match-card:hover { transform: translateX(5px); border-left-color: var(--accent-color); }

        .match-card-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .match-teams { font-size: 1.1em; font-weight: bold; }
        .match-date { font-size: 0.8em; color: #aaa; }

        .match-score {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            min-width: 80px;
        }

        .match-result {
            font-size: 0.75em;
            text-align: center;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
            min-width: 80px;
        }

        .result-win { background-color: #1a5c1a; color: #4CAF50; }
        .result-loss { background-color: #5c1a1a; color: #f44336; }
        .result-draw { background-color: #5c4a1a; color: #FFC107; }
        .match-arrow { color: #aaa; font-size: 1.2em; }

        .match-detail { display: none; }
        .match-detail.active { display: block; }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 20px auto;
            max-width: 800px;
            width: fit-content;
            transition: all 0.2s;
        }

        .back-button:hover { background-color: var(--accent-color); color: #000; }

        .match-detail-header {
            max-width: 800px;
            margin: 0 auto 20px;
            padding: 0 20px;
            text-align: center;
        }

        .match-detail-header h2 { font-size: 1.8em; color: var(--accent-color); }
        .match-detail-header .big-score { font-size: 3em; font-weight: bold; margin: 10px 0; }
        .match-detail-header .match-detail-date { color: #aaa; font-size: 0.9em; }

        .pitch-container { max-width: 500px; margin: 0 auto 10px; padding: 0 20px; }

        .pitch {
            background: linear-gradient(180deg,
                #2d7a2d 0%, #327a32 8.33%, #2d7a2d 8.33%, #327a32 16.66%,
                #2d7a2d 16.66%, #327a32 25%, #2d7a2d 25%, #327a32 33.33%,
                #2d7a2d 33.33%, #327a32 41.66%, #2d7a2d 41.66%, #327a32 50%,
                #2d7a2d 50%, #327a32 58.33%, #2d7a2d 58.33%, #327a32 66.66%,
                #2d7a2d 66.66%, #327a32 75%, #2d7a2d 75%, #327a32 83.33%,
                #2d7a2d 83.33%, #327a32 91.66%, #2d7a2d 91.66%, #327a32 100%
            );
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 20px 10px;
            position: relative;
            overflow: hidden;
        }

        .pitch::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--pitch-line);
            transform: translateY(-50%);
        }

        .pitch::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            border: 2px solid var(--pitch-line);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .pitch-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .pitch-row:last-child { margin-bottom: 0; }

        .pitch-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 60px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .pitch-player:hover { transform: scale(1.1); }

        .pitch-player-img-wrap {
            width: 44px;
            height: 44px;
            position: relative;
        }

        .pitch-player-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            display: block;
        }

        .pitch-player-img.sub-img { border-color: #aaa; opacity: 0.85; }

        .shirt-points {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: var(--gold);
            color: #000;
            font-size: 0.6em;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pitch-player-name {
            font-size: 0.65em;
            text-align: center;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            max-width: 65px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0,0,0,0.5);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .coaches-section { max-width: 500px; margin: 0 auto 10px; padding: 0 20px; }

        .coaches-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 12px 10px;
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
        }

        .coaches-box h3 { color: #aaa; font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .coaches-row { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        .coach-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .coach-item:hover { transform: scale(1.1); }

        .coach-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #aaa;
        }

        .coach-name { font-size: 0.65em; color: #ccc; text-align: center; background: rgba(0,0,0,0.5); padding: 2px 4px; border-radius: 3px; }

        .substitutes-section { max-width: 500px; margin: 10px auto 20px; padding: 0 20px; }
        .substitutes-section h3 { color: var(--accent-color); font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }

        .substitutes-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px 10px;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .match-points-section { max-width: 800px; margin: 0 auto 40px; padding: 0 20px; }
        .match-points-section h3 { color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.9em; }

        .match-player-points {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid var(--secondary-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .match-player-points:hover { transform: translateX(5px); border-left-color: var(--accent-color); }
        .match-player-points-name { font-weight: bold; flex: 1; }
        .match-player-points-score { font-size: 1.4em; font-weight: bold; color: var(--accent-color); }

        .player-profile { display: none; }
        .player-profile.active { display: block; }

        .profile-header {
            max-width: 800px;
            margin: 0 auto 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-img-wrap {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
        }

        .profile-info { flex: 1; }
        .profile-name { font-size: 1.8em; font-weight: bold; }
        .profile-position { color: var(--accent-color); font-size: 0.95em; margin-top: 4px; }
        .profile-number { font-size: 0.85em; color: #aaa; margin-top: 2px; }

        .profile-stats {
            max-width: 800px;
            margin: 0 auto 20px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: center;
            border-top: 3px solid var(--secondary-color);
        }

        .stat-box.training-box { border-top-color: var(--accent-color); }
        .stat-box.match-box { border-top-color: var(--gold); }
        .stat-box-label { font-size: 0.8em; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box-value { font-size: 2em; font-weight: bold; color: var(--accent-color); margin-top: 5px; }
        .stat-box.match-box .stat-box-value { color: var(--gold); }

        .profile-section { max-width: 800px; margin: 0 auto 20px; padding: 0 20px; }
        .profile-section h3 { color: var(--accent-color); font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

        .profile-contact-box {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .profile-contact-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95em;
        }

        .profile-contact-icon { font-size: 1.1em; min-width: 24px; }
        .profile-contact-label { color: #aaa; font-size: 0.8em; min-width: 80px; }
        .profile-contact-value { color: #fff; }

        .profile-match-row {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 3px solid var(--secondary-color);
        }

        .profile-match-name { font-weight: bold; font-size: 0.95em; }
        .profile-match-date { font-size: 0.75em; color: #aaa; margin-top: 2px; }
        .profile-match-pts { font-size: 1.2em; font-weight: bold; color: var(--accent-color); }

        /* ========================================
           SAMKØRSEL
        ======================================== */
        .carpooling-section { max-width: 800px; margin: 0 auto 20px; padding: 0 20px; }

        .carpooling-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: var(--card-color);
            border: 2px solid var(--secondary-color);
            border-radius: 10px;
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
            font-size: 0.85em;
            margin-bottom: 15px;
            width: 100%;
        }

        .carpooling-button:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .carpooling-button .car-icon { font-size: 2em; }

        .carpooling-map-container { display: none; }
        .carpooling-map-container.active { display: block; }

        #carpooling-map {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            border: 2px solid var(--secondary-color);
            margin-bottom: 15px;
        }

        .nearest-players-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }

        .nearest-player-row {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid var(--accent-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .nearest-player-row:hover { transform: translateX(5px); }
        .nearest-player-rank { font-size: 1.2em; min-width: 30px; }
        .nearest-player-info { flex: 1; }
        .nearest-player-name { font-weight: bold; }
        .nearest-player-distance { font-size: 0.8em; color: #aaa; margin-top: 2px; }
        .map-loading { text-align: center; padding: 20px; color: #aaa; font-size: 0.9em; }

        /* ========================================
           TAB VISNING
        ======================================== */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .match-subview { display: none; }
        .match-subview.active { display: block; }
        .last-updated { text-align: center; color: #666; font-size: 0.8em; padding-bottom: 20px; }

        .match-subnav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .subnav-button {
            padding: 8px 25px;
            border: 1px solid var(--secondary-color);
            background: transparent;
            color: var(--text-color);
            font-size: 0.9em;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .subnav-button.active { background-color: var(--secondary-color); font-weight: bold; }
        .subnav-button:hover { background-color: var(--secondary-color); }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-color);
            font-size: 1.1em;
        }

        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--secondary-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .error { text-align: center; padding: 20px; color: #f44336; font-size: 0.9em; }
    </style>
</head>
<body>

    <header>
        <h1>⚽ TST Fodbold</h1>
        <p>Sæson 2025/2026 · Rangliste</p>
    </header>

    <div class="tabs">
        <button class="tab-button active" onclick="showTab('training', this)">🏃 Træning</button>
        <button class="tab-button" onclick="showTab('match', this)">⚽ Kamp</button>
    </div>

    <!-- TRÆNINGS-TAB -->
    <div id="training" class="tab-content active">
        <div class="points-guide">
            <h3>⭐ Sådan optjenes point</h3>
            <div class="points-grid" id="training-guide"></div>
        </div>
        <div class="leaderboard">
            <h2>🏃 Træningsrangliste</h2>
            <div id="training-list"><div class="loading">Henter data</div></div>
        </div>
    </div>

    <!-- KAMP-TAB -->
    <div id="match" class="tab-content">
        <div class="match-subnav" id="match-subnav">
            <button class="subnav-button active" onclick="showMatchSubview('match-leaderboard', this)">🏆 Rangliste</button>
            <button class="subnav-button" onclick="showMatchSubview('match-history-view', this)">📋 Kampe</button>
        </div>

        <div id="match-leaderboard" class="match-subview active">
            <div class="points-guide">
                <h3>⭐ Sådan optjenes point</h3>
                <div class="points-grid" id="match-guide"></div>
            </div>
            <div class="leaderboard">
                <h2>⚽ Kamprangliste</h2>
                <div id="match-list"><div class="loading">Henter data</div></div>
            </div>
        </div>

        <div id="match-history-view" class="match-subview">
            <div class="match-history">
                <h2>📋 Kamphistorik</h2>
                <div id="match-history-list"><div class="loading">Henter data</div></div>
            </div>
        </div>

        <div id="match-detail-view" class="match-detail">
            <button class="back-button" onclick="closeMatchDetail()">← Tilbage til kampe</button>
            <div class="match-detail-header">
                <h2 id="detail-teams"></h2>
                <div class="big-score" id="detail-score"></div>
                <div class="match-detail-date" id="detail-date"></div>
            </div>
            <div class="coaches-section">
                <div class="coaches-box">
                    <h3>👨‍💼 Trænerteam</h3>
                    <div class="coaches-row" id="detail-coaches"></div>
                </div>
            </div>
            <div class="pitch-container">
                <div class="pitch" id="detail-pitch"></div>
            </div>
            <div class="substitutes-section">
                <h3>🔄 Indskiftere</h3>
                <div class="substitutes-row" id="detail-subs"></div>
            </div>
            <div class="match-points-section">
                <h3>🏆 Point denne kamp</h3>
                <div id="detail-points"></div>
            </div>
        </div>
    </div>

    <!-- SPILLERPROFIL -->
    <div id="player-profile" class="player-profile">
        <button class="back-button" onclick="closeProfile()">← Tilbage</button>
        <div class="profile-header">
            <div class="profile-img-wrap" id="profile-img-wrap"></div>
            <div class="profile-info">
                <div class="profile-name" id="profile-name"></div>
                <div class="profile-position" id="profile-position"></div>
                <div class="profile-number" id="profile-number"></div>
            </div>
        </div>
        <div class="profile-stats">
            <div class="stat-box training-box">
                <div class="stat-box-label">🏃 Træningspoint</div>
                <div class="stat-box-value" id="profile-training-pts">0</div>
            </div>
            <div class="stat-box match-box">
                <div class="stat-box-label">⚽ Kamppoint</div>
                <div class="stat-box-value" id="profile-match-pts">0</div>
            </div>
        </div>
        <div class="profile-section" id="profile-contact-section" style="display:none">
            <h3>📋 Kontaktinfo</h3>
            <div class="profile-contact-box" id="profile-contact"></div>
        </div>

        <!-- SAMKØRSEL -->

                <span class="car-icon">🚗</span>
                <span>Samkørsel</span>
            </button>
            <div class="carpooling-map-container" id="carpooling-map-container">
                <div id="carpooling-map"></div>
                <div class="nearest-players-list" id="nearest-players-list"></div>
            </div>

        <div class="profile-section">
            <h3>📅 Seneste kampe</h3>
            <div id="profile-matches"></div>
        </div>
    </div>

    <p class="last-updated" id="last-updated"></p>

    <script>
        // ============================================================
        // SHEET IDs
        // ============================================================
        const SHEET_ID         = '1Mi_8L6jj4FkoDsWNcrwRVZTnCldJrZJ22m8qd3tMYGo';
        const CONTACT_SHEET_ID = 'DIT_PRIVATE_SHEET_ID_HER';

        // ============================================================
        // POINT-REGLER
        // ============================================================
        const trainingPointRules = [
            { label: "Møder til træning", points: 3 },
            { label: "Møder til tiden", points: 1 },
            { label: "Rengøring", points: 2 },
            { label: "Sætter op/pakker ned", points: 1 },
            { label: "5 træninger i træk", points: 5 },
        ];

        const matchPointRules = [
            { label: "Spiller op til 60 minutter", points: 1 },
            { label: "Spiller 60 minutter eller mere", points: 2 },
            { label: "Mål scoret af målmand", points: 10 },
            { label: "Mål scoret af forsvarer", points: 6 },
            { label: "Mål scoret af midtbanespiller", points: 5 },
            { label: "Mål scoret af angriber", points: 4 },
            { label: "Assist", points: 3 },
            { label: "Rent bur (målmand/forsvarer)", points: 4 },
            { label: "Rent bur (midtbanespiller)", points: 1 },
            { label: "3 redninger af målmand", points: 1 },
            { label: "Straffesparksredning", points: 5 },
            { label: "10 defensive bidrag af forsvarer", points: 2 },
            { label: "12 defensive bidrag af midtbanespiller/angriber", points: 2 },
            { label: "Straffesparksmiss", points: -2 },
            { label: "Bonuspoint for bedste spillere", points: 3 },
            { label: "2 mål indkasseret af målmand/forsvarer", points: -1 },
            { label: "Gult kort", points: -1 },
            { label: "Rødt kort", points: -3 },
            { label: "Selvmål", points: -2 },
        ];

        // ============================================================
        // GLOBALE DATA
        // ============================================================
        let players      = {};
        let coaches      = [];
        let contactData  = {};
        let trainingData = [];
        let matchData    = [];
        let matchHistory = [];
        let matchLineups = [];
        let matchPoints  = [];
        let profileReturnContext = null;
        let currentProfileId     = null;
        let carpoolingMap        = null;
        let geocodeCache         = {};

        // ============================================================
        // HJÆLPEFUNKTIONER
        // ============================================================
        function fetchSheet(sheetId, sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;
            return fetch(url).then(r => r.text()).then(parseCSV);
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
            return lines.slice(1).map(line => {
                const values = [];
                let cur = '', inQ = false;
                for (let ch of line) {
                    if (ch === '"') inQ = !inQ;
                    else if (ch === ',' && !inQ) { values.push(cur.trim()); cur = ''; }
                    else cur += ch;
                }
                values.push(cur.trim());
                const obj = {};
                headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/"/g, '').trim());
                return obj;
            }).filter(row => Object.values(row).some(v => v !== ''));
        }

        function avatarUrl(imageFile) {
            if (!imageFile || imageFile.trim() === '') return null;
            return `images/${imageFile}`;
        }

        function buildAvatarEl(imageFile, name, cssClass, size = '45px') {
            const src = avatarUrl(imageFile);
            if (src) {
                const img = document.createElement('img');
                img.className = cssClass;
                img.style.width  = size;
                img.style.height = size;
                img.src = src;
                img.alt = name;
                img.onerror = function() {
                    const div = document.createElement('div');
                    div.className = cssClass + ' avatar-placeholder';
                    div.style.width  = size;
                    div.style.height = size;
                    div.textContent  = initials(name);
                    this.parentNode?.replaceChild(div, this);
                };
                return img;
            } else {
                const div = document.createElement('div');
                div.className = cssClass + ' avatar-placeholder';
                div.style.width  = size;
                div.style.height = size;
                div.textContent  = initials(name);
                return div;
            }
        }

        function initials(name) {
            return (name || '?').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        }

        function findPlayerId(name) {
            return Object.entries(players).find(([, p]) => p.name === name)?.[0] || null;
        }

        // ============================================================
        // INDLÆS DATA
        // ============================================================
        async function loadAllData() {
            try {
                // 1. Players
                const playersRaw = await fetchSheet(SHEET_ID, 'players');
                playersRaw.forEach(p => {
                    const id   = p.player_id?.trim();
                    const name = p.name?.trim();
                    if (!id || !name) return;
                    if (p.role?.trim().toLowerCase() === 'coach') {
                        coaches.push({
                            id,
                            name,
                            nickname: p.nickname?.trim() || name.split(' ')[0],
                            image:    p.image?.trim() || '',
                        });
                    } else {
                        players[id] = {
                        name,
                        nickname: p.nickname?.trim() || name.split(' ')[0],
                        position: p.position?.trim() || '',
                        number:   p.number?.trim() || '',
                        image:    p.image?.trim() || '',
                        address:  p.address?.trim() || '',
                    };
                        };
                    }
                });

                // 2. Training
                const trainingRaw = await fetchSheet(SHEET_ID, 'training');
                trainingData = trainingRaw
                    .filter(row => players[row.player_id?.trim()])
                    .map(row => {
                        const id = row.player_id.trim();
                        return {
                            id,
                            name:     players[id].name,
                            image:    players[id].image,
                            position: players[id].position,
                            points:   parseFloat(row.total) || 0,
                        };
                    })
                    .sort((a, b) => b.points - a.points);

                // 3. Matches
                const matchesRaw = await fetchSheet(SHEET_ID, 'matches');
                matchHistory = matchesRaw.map(row => ({
                    id:        row.id?.trim(),
                    homeTeam:  row.home_team?.trim(),
                    awayTeam:  row.away_team?.trim(),
                    homeScore: parseInt(row.home_score) || 0,
                    awayScore: parseInt(row.away_score) || 0,
                    date:      row.date?.trim(),
                    weekday:   row.weekday?.trim(),
                }));

                // 4. Lineups
                const lineupsRaw = await fetchSheet(SHEET_ID, 'match_lineups');
                matchLineups = lineupsRaw.map(row => {
                    const pid = row.player_id?.trim();
                    return {
                        match_id:  row.match_id?.trim(),
                        position:  row.position?.trim(),
                        player_id: pid,
                        name:      players[pid]?.name     || pid,
                        nickname:  players[pid]?.nickname || pid,
                        image:     players[pid]?.image    || '',
                    };
                });

                // 5. Match points
                const pointsRaw = await fetchSheet(SHEET_ID, 'match_points');
                if (pointsRaw.length > 0) {
                    const headers   = Object.keys(pointsRaw[0]);
                    const matchCols = headers.slice(2);

                    pointsRaw.forEach(row => {
                        const pid = row.player_id?.trim();
                        if (!pid || !players[pid]) return;
                        matchCols.forEach((col, i) => {
                            const pts = parseFloat(row[col]) || 0;
                            if (pts > 0) {
                                matchPoints.push({
                                    match_id:  matchHistory[i]?.id || String(i + 1),
                                    player_id: pid,
                                    name:      players[pid].name,
                                    image:     players[pid].image,
                                    points:    pts,
                                });
                            }
                        });
                    });

                    const totals = {};
                    pointsRaw.forEach(row => {
                        const pid = row.player_id?.trim();
                        if (!pid || !players[pid]) return;
                        totals[pid] = {
                            id:     pid,
                            name:   players[pid].name,
                            image:  players[pid].image,
                            points: parseFloat(row.total) || 0,
                        };
                    });
                    matchData = Object.values(totals).sort((a, b) => b.points - a.points);
                }

                // 6. Kontaktdata
                try {
                    const contactRaw = await fetchSheet(CONTACT_SHEET_ID, 'contact');
                    contactRaw.forEach(row => {
                        const pid = row.player_id?.trim();
                        if (pid) contactData[pid] = {
                            email:   row.email?.trim()   || '',
                            phone:   row.phone?.trim()   || '',
                            address: row.address?.trim() || '',
                        };
                    });
                } catch (e) {
                    console.log('Kontaktdata ikke tilgængelig endnu');
                }

                // Byg siden
                buildGuide(trainingPointRules, 'training-guide');
                buildGuide(matchPointRules, 'match-guide');
                buildLeaderboard(trainingData, 'training-list');
                buildLeaderboard(matchData, 'match-list');
                buildMatchHistory();

                const now    = new Date();
                const months = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
                document.getElementById('last-updated').textContent =
                    `Sidst opdateret: ${now.getDate()}. ${months[now.getMonth()]} ${now.getFullYear()}`;

            } catch (err) {
                console.error(err);
                document.querySelectorAll('.loading').forEach(el => {
                    el.className = 'error';
                    el.textContent = 'Kunne ikke hente data. Tjek at Google Sheet er publiceret korrekt.';
                });
            }
        }

        // ============================================================
        // BYGG GUIDE
        // ============================================================
        function buildGuide(rules, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            rules.forEach(rule => {
                const badge = document.createElement('div');
                badge.className = 'point-badge';
                badge.innerHTML = `${rule.label} <span>${rule.points > 0 ? '+' : ''}${rule.points}p</span>`;
                container.appendChild(badge);
            });
        }

        // ============================================================
        // BYGG RANGLISTE
        // ============================================================
        function buildLeaderboard(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!data.length) {
                container.innerHTML = '<div class="error">Ingen data endnu</div>';
                return;
            }

            data.forEach((player, index) => {
                const rank        = index + 1;
                const rankClass   = rank <= 3 ? `rank-${rank}` : '';
                const rankDisplay = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

                const card = document.createElement('div');
                card.className = `player-card ${rankClass}`;
                card.onclick = () => openProfile(player.id);

                const rankEl = document.createElement('div');
                rankEl.className = 'rank';
                rankEl.textContent = rankDisplay;

                const avatar = buildAvatarEl(player.image, player.name, 'card-avatar', '45px');

                const infoEl = document.createElement('div');
                infoEl.className = 'player-info';
                infoEl.innerHTML = `
                    <div class="player-name">${player.name}</div>
                    <div class="player-details">${player.position || ''}</div>
                `;

                const pointsEl = document.createElement('div');
                pointsEl.innerHTML = `
                    <div class="player-points">${player.points}</div>
                    <div class="points-label">point</div>
                `;

                card.appendChild(rankEl);
                card.appendChild(avatar);
                card.appendChild(infoEl);
                card.appendChild(pointsEl);
                container.appendChild(card);
            });
        }

        // ============================================================
        // BYGG KAMPHISTORIK
        // ============================================================
        function buildMatchHistory() {
            const container = document.getElementById('match-history-list');
            container.innerHTML = '';

            if (!matchHistory.length) {
                container.innerHTML = '<div class="error">Ingen kampe endnu</div>';
                return;
            }

            matchHistory.forEach(match => {
                const diff        = match.homeScore - match.awayScore;
                const resultClass = diff > 0 ? 'result-win' : diff < 0 ? 'result-loss' : 'result-draw';
                const resultText  = diff > 0 ? 'SEJR' : diff < 0 ? 'NEDERLAG' : 'UAFGJORT';

                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => openMatchDetail(match.id);
                card.innerHTML = `
                    <div class="match-card-left">
                        <div class="match-teams">${match.homeTeam} vs ${match.awayTeam}</div>
                        <div class="match-date">📅 ${match.weekday} ${match.date}</div>
                    </div>
                    <div class="match-score">${match.homeScore}-${match.awayScore}</div>
                    <div class="match-result ${resultClass}">${resultText}</div>
                    <div class="match-arrow">›</div>
                `;
                container.appendChild(card);
            });
        }

        // ============================================================
        // BYGG BANE-RÆKKE
        // ============================================================
        function buildPitchRow(playersArr, pointsMap, isSub = false) {
            const row = document.createElement('div');
            row.className = 'pitch-row';

            playersArr.forEach(({ player_id, name, nickname, image }) => {
                const pts = pointsMap[name] || 0;
                const el  = document.createElement('div');
                el.className = 'pitch-player';
                el.onclick = () => openProfile(player_id);

                const imgWrap = document.createElement('div');
                imgWrap.className = 'pitch-player-img-wrap';

                const img = buildAvatarEl(image, name, 'pitch-player-img' + (isSub ? ' sub-img' : ''), '44px');

                const ptsBadge = document.createElement('div');
                ptsBadge.className = 'shirt-points';
                ptsBadge.textContent = pts;

                imgWrap.appendChild(img);
                imgWrap.appendChild(ptsBadge);

                const nameEl = document.createElement('div');
                nameEl.className = 'pitch-player-name';
                nameEl.textContent = nickname || name.split(' ')[0];

                el.appendChild(imgWrap);
                el.appendChild(nameEl);
                row.appendChild(el);
            });

            return row;
        }

        // ============================================================
        // ÅBEN KAMP DETALJE
        // ============================================================
        function openMatchDetail(matchId) {
            const match = matchHistory.find(m => m.id === matchId);
            if (!match) return;

            document.getElementById('match-history-view').style.display = 'none';
            document.getElementById('match-subnav').style.display = 'none';
            document.getElementById('match-detail-view').classList.add('active');

            document.getElementById('detail-teams').textContent = `${match.homeTeam} vs ${match.awayTeam}`;
            document.getElementById('detail-score').textContent = `${match.homeScore} - ${match.awayScore}`;
            document.getElementById('detail-date').textContent  = `📅 ${match.weekday} ${match.date}`;

            const pointsMap = {};
            matchPoints.filter(p => p.match_id === matchId).forEach(p => { pointsMap[p.name] = p.points; });

            const lineup = matchLineups.filter(l => l.match_id === matchId);
            const getPos = pos => lineup.filter(l => l.position === pos);

            // Trænerteam
            const coachesContainer = document.getElementById('detail-coaches');
            coachesContainer.innerHTML = '';
            coaches.forEach(coach => {
                const item = document.createElement('div');
                item.className = 'coach-item';
                item.onclick = () => openProfile(coach.id);
                const img = buildAvatarEl(coach.image, coach.name, 'coach-img', '44px');
                const nameEl = document.createElement('div');
                nameEl.className = 'coach-name';
                nameEl.textContent = coach.nickname;
                item.appendChild(img);
                item.appendChild(nameEl);
                coachesContainer.appendChild(item);
            });

            // Bane
            const pitch = document.getElementById('detail-pitch');
            pitch.innerHTML = '';
            const rows = [
                getPos('striker'),
                [...getPos('left_wing'), ...getPos('attacking_mid'), ...getPos('right_wing')],
                getPos('defensive_mid'),
                [...getPos('left_back'), ...getPos('centerback'), ...getPos('right_back')],
                getPos('goalkeeper'),
            ];
            rows.forEach(row => { if (row.length > 0) pitch.appendChild(buildPitchRow(row, pointsMap)); });

            // Indskiftere
            const subs = getPos('substitute');
            const subsContainer = document.getElementById('detail-subs');
            subsContainer.innerHTML = '';
            if (subs.length) {
                const subRow = buildPitchRow(subs, pointsMap, true);
                Array.from(subRow.children).forEach(child => subsContainer.appendChild(child));
            }

            // Point-liste
            const pointsContainer = document.getElementById('detail-points');
            pointsContainer.innerHTML = '';
            matchPoints
                .filter(p => p.match_id === matchId)
                .sort((a, b) => b.points - a.points)
                .forEach(player => {
                    const el = document.createElement('div');
                    el.className = 'match-player-points';
                    el.onclick = () => openProfile(player.player_id);
                    const avatar = buildAvatarEl(player.image, player.name, 'card-avatar', '36px');
                    const nameEl = document.createElement('div');
                    nameEl.className = 'match-player-points-name';
                    nameEl.textContent = player.name;
                    const ptsEl = document.createElement('div');
                    ptsEl.className = 'match-player-points-score';
                    ptsEl.textContent = `+${player.points}p`;
                    el.appendChild(avatar);
                    el.appendChild(nameEl);
                    el.appendChild(ptsEl);
                    pointsContainer.appendChild(el);
                });
        }

        function closeMatchDetail() {
            document.getElementById('match-detail-view').classList.remove('active');
            document.getElementById('match-history-view').style.display = 'block';
            document.getElementById('match-subnav').style.display = 'flex';
        }

        // ============================================================
        // SPILLERPROFIL
        // ============================================================
        function openProfile(playerId) {
            if (!playerId) return;
            const player = players[playerId];
            if (!player) return;

            profileReturnContext = document.querySelector('.tab-content.active')?.id || 'training';
            currentProfileId    = playerId;
            carpoolingMap       = null;
            document.getElementById('carpooling-map-container').classList.remove('active');

            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelector('.tabs').style.display = 'none';
            document.getElementById('last-updated').style.display = 'none';
            document.getElementById('player-profile').classList.add('active');

            const imgWrap = document.getElementById('profile-img-wrap');
            imgWrap.innerHTML = '';
            imgWrap.appendChild(buildAvatarEl(player.image, player.name, 'profile-img', '90px'));

            document.getElementById('profile-name').textContent     = player.name;
            document.getElementById('profile-position').textContent = player.position || 'Spiller';
            document.getElementById('profile-number').textContent   = player.number ? `#${player.number}` : 'Trøjenummer ikke tildelt endnu';

            const trainingPts = trainingData.find(t => t.id === playerId)?.points || 0;
            const matchPts    = matchData.find(m => m.id === playerId)?.points    || 0;
            document.getElementById('profile-training-pts').textContent = trainingPts;
            document.getElementById('profile-match-pts').textContent    = matchPts;

            // Kontaktinfo
            const contactSection = document.getElementById('profile-contact-section');
            const contactBox     = document.getElementById('profile-contact');
            const contact        = contactData[playerId];
            contactBox.innerHTML = '';

            if (contact && (contact.email || contact.phone || contact.address)) {
                contactSection.style.display = 'block';
                if (contact.phone)   contactBox.innerHTML += `<div class="profile-contact-row"><span class="profile-contact-icon">📱</span><span class="profile-contact-label">Telefon</span><span class="profile-contact-value">${contact.phone}</span></div>`;
                if (contact.email)   contactBox.innerHTML += `<div class="profile-contact-row"><span class="profile-contact-icon">✉️</span><span class="profile-contact-label">Email</span><span class="profile-contact-value">${contact.email}</span></div>`;
                if (contact.address) contactBox.innerHTML += `<div class="profile-contact-row"><span class="profile-contact-icon">📍</span><span class="profile-contact-label">Adresse</span><span class="profile-contact-value">${contact.address}</span></div>`;
            } else {
                contactSection.style.display = 'none';
            }

            // Seneste kampe
            const matchesContainer = document.getElementById('profile-matches');
            matchesContainer.innerHTML = '';
            const playerMatchPts = matchPoints
                .filter(p => p.player_id === playerId)
                .sort((a, b) => matchHistory.findIndex(m => m.id === b.match_id) - matchHistory.findIndex(m => m.id === a.match_id));

            if (!playerMatchPts.length) {
                matchesContainer.innerHTML = '<div style="color:#aaa;font-size:0.85em;padding:10px 0">Ingen kampe endnu</div>';
            } else {
                playerMatchPts.forEach(mp => {
                    const match = matchHistory.find(m => m.id === mp.match_id);
                    if (!match) return;
                    const row = document.createElement('div');
                    row.className = 'profile-match-row';
                    row.innerHTML = `
                        <div>
                            <div class="profile-match-name">${match.homeTeam} vs ${match.awayTeam}</div>
                            <div class="profile-match-date">${match.weekday} ${match.date}</div>
                        </div>
                        <div class="profile-match-pts">+${mp.points}p</div>
                    `;
                    matchesContainer.appendChild(row);
                });
            }
        }

        function closeProfile() {
            document.getElementById('player-profile').classList.remove('active');
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = '');
            document.querySelector('.tabs').style.display = '';
            document.getElementById('last-updated').style.display = '';

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            document.getElementById(profileReturnContext)?.classList.add('active');
            document.querySelectorAll('.tab-button').forEach(btn => {
                if (btn.getAttribute('onclick')?.includes(profileReturnContext)) btn.classList.add('active');
            });
        }

        // ============================================================
        // SAMKØRSEL OG KORT
        // ============================================================
        function toggleCarpooling() {
            const container = document.getElementById('carpooling-map-container');
            const isActive  = container.classList.contains('active');
            if (isActive) {
                container.classList.remove('active');
            } else {
                container.classList.add('active');
                if (!carpoolingMap) initCarpoolingMap(currentProfileId);
            }
        }

        async function geocodeAddress(address) {
            if (geocodeCache[address]) return geocodeCache[address];
            const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(address + ', Aarhus, Denmark')}&key=AIzaSyD8ZEJLf-HtP_yicBVZC3eCmO9QavoYK0Y`;
            try {
                const res  = await fetch(url);
                const data = await res.json();
                if (data.results?.[0]) {
                    const loc = data.results[0].geometry.location;
                    geocodeCache[address] = loc;
                    return loc;
                }
            } catch (e) { console.error('Geocode fejl:', e); }
            return null;
        }

        async function getDistances(originAddress, destinations) {
            const destString = destinations.map(d => encodeURIComponent(d + ', Aarhus, Denmark')).join('|');
            const url = `https://maps.googleapis.com/maps/api/distancematrix/json?origins=${encodeURIComponent(originAddress + ', Aarhus, Denmark')}&destinations=${destString}&mode=driving&key=AIzaSyD8ZEJLf-HtP_yicBVZC3eCmO9QavoYK0Y`;
            try {
                const res  = await fetch(url);
                const data = await res.json();
                return data.rows[0]?.elements || [];
            } catch (e) { console.error('Distance fejl:', e); return []; }
        }

        async function initCarpoolingMap(profileId) {
            const mapContainer = document.getElementById('carpooling-map');
            mapContainer.innerHTML = '<div class="map-loading">🗺️ Henter adresser...</div>';

            const currentContact = contactData[profileId] || players[profileId];
                if (!currentContact?.address) {
                mapContainer.innerHTML = '<div class="map-loading">Ingen adresse registreret for denne spiller</div>';
                return;
            }

            // Geocode alle spillere med adresser
            const allPlayers = Object.entries(players)
                .filter(([id, p]) => contactData[id]?.address || p.address)
                    .map(([id, p]) => ({
                        id,
                        name:     p.name,
                        nickname: p.nickname,
                        image:    p.image,
                        address:  contactData[id]?.address || p.address,
                }));

            if (allPlayers.length === 0) {
                mapContainer.innerHTML = '<div class="map-loading">Ingen adresser registreret endnu</div>';
                return;
            }

            const geocoded = (await Promise.all(
                allPlayers.map(async p => ({ ...p, coords: await geocodeAddress(p.address) }))
            )).filter(p => p.coords);

            // Hent køreafstande
            const otherPlayers  = geocoded.filter(p => p.id !== profileId);
            const distances     = await getDistances(currentContact.address, otherPlayers.map(p => p.address));

            const playersWithDistance = otherPlayers.map((p, i) => ({
                ...p,
                distance:     distances[i]?.distance?.value || Infinity,
                distanceText: distances[i]?.distance?.text  || '?',
            })).sort((a, b) => a.distance - b.distance);

            // Opret kort
            mapContainer.innerHTML = '';
            const selfCoords = geocoded.find(p => p.id === profileId)?.coords || { lat: 56.1629, lng: 10.2039 };

            carpoolingMap = new google.maps.Map(mapContainer, {
                zoom: 13,
                center: selfCoords,
                styles: [
                    { elementType: 'geometry',            stylers: [{ color: '#0f3d0f' }] },
                    { elementType: 'labels.text.fill',    stylers: [{ color: '#ffffff' }] },
                    { elementType: 'labels.text.stroke',  stylers: [{ color: '#0f3d0f' }] },
                    { featureType: 'road', elementType: 'geometry',             stylers: [{ color: '#1a5c1a' }] },
                    { featureType: 'road', elementType: 'geometry.stroke',      stylers: [{ color: '#2d8c2d' }] },
                    { featureType: 'road', elementType: 'labels.text.fill',     stylers: [{ color: '#9ca5b3' }] },
                    { featureType: 'water', elementType: 'geometry',            stylers: [{ color: '#0a2a0a' }] },
                    { featureType: 'poi',     stylers: [{ visibility: 'off' }] },
                    { featureType: 'transit', stylers: [{ visibility: 'off' }] },
                ],
            });

            const top5ids = new Set(playersWithDistance.slice(0, 5).map(p => p.id));

            // Tilføj markers
            geocoded.forEach(p => {
                const isSelf    = p.id === profileId;
                const isNearest = top5ids.has(p.id);

                const markerIcon = isSelf ? {
                    url: 'https://maps.gstatic.com/mapfiles/ms2/micons/soccer.png',
                    scaledSize: new google.maps.Size(40, 40),
                } : isNearest ? {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 12,
                    fillColor: '#4CAF50',
                    fillOpacity: 1,
                    strokeColor: '#ffffff',
                    strokeWeight: 2,
                } : {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 7,
                    fillColor: '#1a5c1a',
                    fillOpacity: 1,
                    strokeColor: '#4CAF50',
                    strokeWeight: 1,
                };

                const marker = new google.maps.Marker({
                    position: p.coords,
                    map:      carpoolingMap,
                    icon:     markerIcon,
                    title:    p.name,
                });

                const distanceText = !isSelf && playersWithDistance.find(pw => pw.id === p.id)
                    ? `<div style="color:#4CAF50;font-size:0.85em">${playersWithDistance.find(pw => pw.id === p.id).distanceText} væk</div>`
                    : '<div style="color:#4CAF50;font-size:0.85em">Det er dig! 📍</div>';

                const infoWindow = new google.maps.InfoWindow({
                    content: `
                        <div style="background:#1e1e1e;color:#fff;padding:8px 12px;border-radius:8px;font-family:sans-serif;cursor:pointer" onclick="openProfile('${p.id}')">
                            <div style="font-weight:bold">${p.name}</div>
                            ${distanceText}
                            <div style="color:#aaa;font-size:0.75em;margin-top:4px">Klik for at se profil</div>
                        </div>
                    `,
                });

                marker.addListener('mouseover', () => infoWindow.open(carpoolingMap, marker));
                marker.addListener('mouseout',  () => infoWindow.close());
                marker.addListener('click',     () => openProfile(p.id));
            });

            // Liste over 5 nærmeste
            const listContainer = document.getElementById('nearest-players-list');
            listContainer.innerHTML = '<h3 style="color:var(--accent-color);font-size:0.85em;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">🚗 5 nærmeste spillere</h3>';

            playersWithDistance.slice(0, 5).forEach((p, index) => {
                const row = document.createElement('div');
                row.className = 'nearest-player-row';
                row.onclick = () => openProfile(p.id);

                const avatar = buildAvatarEl(p.image, p.name, 'card-avatar', '36px');

                const infoEl = document.createElement('div');
                infoEl.className = 'nearest-player-info';
                infoEl.innerHTML = `
                    <div class="nearest-player-name">${p.name}</div>
                    <div class="nearest-player-distance">🚗 ${p.distanceText} væk</div>
                `;

                const rankEl = document.createElement('div');
                rankEl.className = 'nearest-player-rank';
                rankEl.textContent = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;

                row.appendChild(rankEl);
                row.appendChild(avatar);
                row.appendChild(infoEl);
                listContainer.appendChild(row);
            });
        }

        // ============================================================
        // TAB NAVIGATION
        // ============================================================
        function showTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');
        }

        function showMatchSubview(viewName, btn) {
            document.querySelectorAll('.match-subview').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.subnav-button').forEach(b => b.classList.remove('active'));
            document.getElementById(viewName).classList.add('active');
            btn.classList.add('active');
        }

        // Start
        loadAllData();
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD8ZEJLf-HtP_yicBVZC3eCmO9QavoYK0Y&libraries=geometry&callback=Function.prototype" async defer></script>
</body>
</html>
